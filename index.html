<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What Comes Next?</title>
<meta name="theme-color" content="#d9622b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="What Next?">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" crossorigin="anonymous"></script>
<style>
  /* Layout: maker mode is a settings card above a column of A4 sheet previews; each sheet prints in black and white as one wordless page of 4 to 8 picture patterns (a row of 8 squares each, some left empty), the answer QR code top right and optional cut-out pieces at the bottom. Answer mode (the QR's #ss0… link) is the page's rows solved, on a card. */
  :root{
    --ink:#1f2a44; --tang:#d9622b; --cream:#f7f1e3; --cream-dark:#e2d6b8;
    --go:#2fa34a; --red:#c2410c; --gap:#ececec; --hint:#fff1b8;
    --read:Verdana,Tahoma,sans-serif;
    --title:'Luckiest Guy','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
    --z:1;
    color-scheme: light;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  body{background:var(--tang);color:var(--ink);font-family:var(--read);-webkit-tap-highlight-color:transparent;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  button,input,select{font:inherit;color:inherit;touch-action:manipulation}
  button{cursor:pointer}

  #home{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));z-index:50;
    width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#2a2140;background:rgba(255,255,255,.82);
    box-shadow:0 3px 0 rgba(0,0,0,.18);touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-decoration:none}
  #home svg{width:24px;height:24px}
  #home:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}

  /* ---------- maker ---------- */
  main{max-width:860px;margin:0 auto;
    padding:calc(12px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px))
            calc(28px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-left,0px))}
  header{padding-left:56px;min-height:44px;color:#fff}
  h1{font-family:var(--title);font-weight:400;font-size:clamp(30px,6vw,42px);letter-spacing:1px;line-height:1.1;margin:0;
    text-shadow:0 3px 0 rgba(0,0,0,.25)}
  header p{margin:6px 0 0;font-size:14px;line-height:1.45;opacity:.95}
  #controls{margin:16px 0 22px;background:var(--cream);border-radius:16px;padding:14px;box-shadow:0 4px 0 rgba(0,0,0,.2);
    display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:12px 14px}
  #controls label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:bold}
  #controls input,#controls select{height:44px;width:100%;border:2px solid var(--cream-dark);border-radius:10px;background:#fff;
    padding:0 10px;font-size:16px}
  .btns{grid-column:1/-1;display:flex;gap:10px}
  .btns button{flex:1;height:54px;border:0;border-radius:14px;color:#fff;font-family:var(--title);font-size:clamp(18px,5.4vw,24px);letter-spacing:1px;white-space:nowrap;
    padding-top:4px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
  .btns button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
  #new{background:var(--red)}
  #print{background:var(--go)}

  #pages{display:flex;flex-direction:column;align-items:center;gap:22px}
  .page{position:relative}
  .reroll{position:absolute;bottom:8px;right:8px;width:44px;height:44px;border-radius:50%;border:0;background:var(--cream);
    box-shadow:0 3px 0 rgba(0,0,0,.2);display:grid;place-items:center;padding:0}
  .reroll svg{width:24px;height:24px}

  /* one printed A4 page; all sizes in mm so the preview is the print. --z shrinks the preview to fit a phone. */
  .sheet{zoom:var(--z);width:210mm;height:296.5mm;padding:12mm;background:#fff;overflow:hidden;
    display:flex;align-items:flex-start;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}
  .sheet svg{display:block}
  .pt .cell{fill:#fff;stroke:var(--ink)}
  .pt .cell.gap{fill:var(--gap)}
  .pt .cell.hint{fill:var(--hint)}
  .pt .cut{fill:#fff;stroke:var(--ink);stroke-dasharray:1.2 1}
  .pt .sep{stroke:var(--ink);stroke-dasharray:1.2 1}
  .pt .go{fill:var(--ink)}

  /* ---------- answer ---------- */
  #answer{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
    padding-top:calc(64px + env(safe-area-inset-top,0px))}
  .solved{width:min(100%,640px);background:#fff;border-radius:14px;padding:14px;box-shadow:0 6px 0 rgba(0,0,0,.2);
    display:flex;flex-direction:column;align-items:center;gap:12px}
  .solved svg{width:100%;height:auto;display:block}
  #make{color:var(--red);font-size:14px}
  body.answering #maker, body:not(.answering) #answer{display:none}

  /* ---------- print: only the sheets, one per page ---------- */
  @page{size:A4 portrait;margin:0}
  @media print{
    body{background:#fff}
    #home,main>header,#controls,.reroll,#answer{display:none!important}
    main{padding:0;max-width:none}
    #pages{display:block}
    .sheet{zoom:1!important;box-shadow:none}
    .page:not(:last-child){break-after:page}
  }
</style>
</head>
<body>
<a id="home" href="../print.html" aria-label="All printables" title="All printables"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 9.8V20h12V9.8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M10 20v-5.5h4V20" fill="currentColor"/></svg></a>

<main id="maker">
  <header>
    <h1>What Comes Next?</h1>
    <p>Print a sheet of picture patterns. Each row repeats or grows in its own way; your child works out the pattern and draws the missing pictures in the grey squares, or cuts out the pieces at the bottom and glues them in. Scan the QR code to see the answers.</p>
  </header>
  <form id="controls" onsubmit="return false">
    <label>Level <select id="level"></select></label>
    <label>Pictures
      <select id="pics"><option value="shapes">Shapes</option><option value="things">Sun, fish, house…</option><option value="mix">A mix</option></select>
    </label>
    <label>Rows <select id="rows"></select></label>
    <label>Cut-out pieces
      <select id="pieces"><option value="yes">Yes</option><option value="no">No</option></select>
    </label>
    <label>Pages <input id="sheets" type="number" inputmode="numeric"></label>
    <div class="btns"><button id="new" type="button">New patterns</button><button id="print" type="button">Print</button></div>
  </form>
  <div id="pages"></div>
</main>

<main id="answer"><div id="solved" class="solved"></div></main>

<script>
/* ======== tuning ======== */
const DEFAULTS = { level: 0, pics: 'shapes', rows: 6, pieces: 'yes', sheets: 1 };
const LEVELS = ['Easy', 'Medium', 'Hard'];
const ROW = 8;                       // squares in a row
const ROWS = [4, 5, 6, 7, 8];        // rows on a page, offered in the list
// What a row can be, per level: [kind, weight, patterns]. Kinds: s = pictures, f = white / black, z = big / small
// (patterns are repeating units, a letter per picture), t = turning, c = counting dots (steps: +1 up, -1 down).
const KINDS = [
  [['s', 4, ['AB', 'AAB', 'ABB']], ['f', 1, ['AB']], ['z', 1, ['AB']]],
  [['s', 4, ['ABC', 'AABB', 'AAB', 'ABB']], ['f', 1, ['AAB', 'ABB']], ['z', 1, ['AAB', 'ABB']], ['t', 1, [1]], ['c', 1, [1]]],
  [['s', 4, ['ABCD', 'AABC', 'ABCB', 'ABAC', 'ABCC']], ['f', 1, ['AABB', 'ABBB']], ['z', 1, ['AABB', 'ABBB']], ['t', 1.5, [1, -1]], ['c', 1, [1, -1]]],
];
const BLANKS = [[1, 2], [2, 2], [2, 3]];   // fewest and most empty squares in a row, per level
const KIND_MAX = { s: 8, f: 2, z: 2, t: 2, c: 1 };   // most rows of each kind on one page
const SHEETS_MAX = 20;
const MAX_CELL = 22;                 // mm, biggest square on the sheet
const PIC = 0.74;                    // a picture's size, as a share of its square
const SMALL = 0.55;                  // a small picture, as a share of a big one
const QR = 22;                       // mm, the answer QR code
const PUBLIC_URL = 'https://tb-x.github.io/what-comes-next/';   // where the QR points when the maker isn't on GitHub Pages
const TRIES = 60;                    // attempts to place the empty squares so a row still has one clear answer

/* ======== small helpers ======== */
const $ = (id) => document.getElementById(id);
const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = rint(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const range = (n) => Array.from({ length: n }, (_, i) => i);
const f = (x) => +x.toFixed(2);
const weighted = (list) => { let r = Math.random() * list.reduce((s, it) => s + it[1], 0); return list.find((it) => (r -= it[1]) < 0) || list[0]; };

/* ======== settings (remembered per browser) ======== */
const KEY = 'whatnext.settings';
let settings = { ...DEFAULTS };
try { Object.assign(settings, JSON.parse(localStorage.getItem(KEY)) || {}); } catch { /* blocked on file:// */ }
const saveSettings = () => { try { localStorage.setItem(KEY, JSON.stringify(settings)); } catch { /* ignore */ } };
const clamp = (v, a, b, d) => (Number.isFinite(+v) && v !== '' ? Math.min(b, Math.max(a, Math.round(+v))) : d);

/* ======== pictures ======== */
// Each is drawn in a 100 × 100 box centred on 0,0, as black lines on white: the sheets are printed in black and
// white, so every picture in a set has its own outline (the same pictures as Picture Sudoku).
const INK = '#1f2a44';
const STROKE = `fill="#fff" stroke="${INK}" stroke-width="5" stroke-linejoin="round"`;
const starPath = () => range(10).map((i) => {
  const r = i % 2 ? 19 : 47, a = (i * 36 - 90) * Math.PI / 180;
  return `${i ? 'L' : 'M'}${f(r * Math.cos(a))} ${f(r * Math.sin(a) + 4)}`;
}).join('') + 'z';
const SHAPES = [
  `<circle r="40" ${STROKE}/>`,
  `<rect x="-36" y="-36" width="72" height="72" rx="8" ${STROKE}/>`,
  `<path d="M0-40 44 36H-44z" ${STROKE}/>`,
  `<path d="M0 40C-30 18-46 2-46-16-46-32-34-42-22-42-10-42-3-35 0-27 3-35 10-42 22-42 34-42 46-32 46-16 46 2 30 18 0 40z" ${STROKE}/>`,
  `<path d="${starPath()}" ${STROKE}/>`,
  `<path d="M0-46 36 0 0 46-36 0z" ${STROKE}/>`,
];
const rays = range(8).map((k) => {
  const a = k * Math.PI / 4, c = Math.cos(a), si = Math.sin(a);
  return `M${f(31 * c)} ${f(31 * si)}L${f(45 * c)} ${f(45 * si)}`;
}).join('');
const petals = range(5).map((k) => {
  const a = (k * 72 - 90) * Math.PI / 180;
  return `<circle cx="${f(24 * Math.cos(a))}" cy="${f(24 * Math.sin(a) + 2)}" r="16" ${STROKE}/>`;
}).join('');
const THINGS = [
  `<path d="${rays}" stroke="${INK}" stroke-width="6" stroke-linecap="round"/><circle r="22" ${STROKE}/>`,                        // sun
  `<g transform="translate(2 0)"><path d="M-46-20-24 0-46 20z" ${STROKE}/><path d="M-24 0C-8-30 26-30 42 0 26 30-8 30-24 0z" ${STROKE}/>
    <circle cx="24" cy="-5" r="4.5" fill="${INK}"/></g>`,                                                                       // fish
  `<rect x="-30" y="-6" width="60" height="44" ${STROKE}/><path d="M-42-2 0-42 42-2z" ${STROKE}/>
    <rect x="-8" y="14" width="16" height="24" ${STROKE}/>`,                                                                     // house
  `<rect x="-7" y="22" width="14" height="20" ${STROKE}/><path d="M0-44 30-6H14L38 26H-38L-14-6H-30z" ${STROKE}/>`,                // tree
  `${petals}<circle cy="2" r="13" ${STROKE}/>`,                                                                                   // flower
  `<path d="M27-37.6A40 40 0 1 0 27 37.6 42 42 0 0 1 27-37.6z" ${STROKE}/>`,                                                      // moon
];
// pictures that turn: each points up at a quarter turn of 0
const TURNERS = [
  `<path d="M0-44 32-8H13V42H-13V-8H-32z" ${STROKE}/>`,                                                                           // arrow
  `<path d="M0 4-28.3-24.3A40 40 0 1 0 28.3-24.3z" ${STROKE}/><circle cx="-16" cy="2" r="5" fill="${INK}"/>`,                     // chomper
  `<rect x="-38" y="-38" width="76" height="76" ${STROKE}/><rect x="-38" y="-38" width="38" height="38" fill="${INK}"/>`,         // square with a dark corner
];
// counting dots: n of 8 dots filled in, in a frame of two columns, filled row by row
const dotFrame = (n) => `<rect x="-34" y="-48" width="68" height="96" rx="12" ${STROKE}/>` + range(8).map((k) => {
  const x = k % 2 ? 15 : -15, y = -33 + Math.floor(k / 2) * 22;
  return k < n ? `<circle cx="${x}" cy="${y}" r="8.5" fill="${INK}"/>` : `<circle cx="${x}" cy="${y}" r="7" fill="none" stroke="${INK}" stroke-width="2.5"/>`;
}).join('');
const SET_CODE = { shapes: 's', things: 't' };   // also the letter in the answer link
const SET_NAMES = Object.keys(SET_CODE);
const SETS = { shapes: SHAPES, things: THINGS };

// the picture for value v of a row, s mm wide, centred on x, y
function item(row, v, x, y, s) {
  const g = (inner, extra = '') => `<g transform="translate(${f(x)} ${f(y)}) ${extra} scale(${f(s / 100)})">${inner}</g>`;
  switch (row.kind) {
    case 's': return g(SETS[row.set][v]);
    case 'f': return g(v ? SETS[row.set][row.base].replaceAll('fill="#fff"', `fill="${INK}"`) : SETS[row.set][row.base]);
    case 'z': return `<g transform="translate(${f(x)} ${f(y)}) scale(${f(s / 100 * (v ? SMALL : 1))})">${SETS[row.set][row.base]}</g>`;
    case 't': return g(TURNERS[row.base], `rotate(${v * 90})`);
    default: return g(dotFrame(v));
  }
}

// scissors for the cut line, s mm long, pointing right
const scissors = (x, y, s) => `<g transform="translate(${f(x)} ${f(y)}) scale(${f(s / 100)})" fill="none" stroke="${INK}" stroke-width="9" stroke-linecap="round">
  <circle cx="-30" cy="-20" r="16"/><circle cx="-30" cy="20" r="16"/><path d="M-16-12 46 22M-16 12 46-22"/></g>`;

/* ======== patterns ======== */
// A row is { kind, set, base, vals: ROW values, blank: ROW booleans }. For a repeating unit (s, f, z) the whole unit
// shows somewhere without a gap, and every empty square is pinned down by the squares that show: the shortest repeat
// that fits what's shown must say what goes in every gap. Turning and counting rows only need their first two showing.
function unitOk(vals, blank, L) {
  if (!range(ROW - L + 1).some((s) => range(L).every((k) => !blank[s + k]))) return false;
  for (let p = 1; p <= L; p++) {
    const seen = {};
    let fits = true;
    for (let i = 0; i < ROW && fits; i++) if (!blank[i]) {
      const k = i % p;
      if (k in seen && seen[k] !== vals[i]) fits = false;
      seen[k] = vals[i];
    }
    if (!fits) continue;
    // the shortest repeat that fits: it has to fill every gap, with the right picture
    return range(ROW).every((i) => !blank[i] || seen[i % p] === vals[i]);
  }
  return false;
}

function placeBlanks(level, n) {
  const b = new Array(ROW).fill(false);
  if (level === 0) for (let i = ROW - n; i < ROW; i++) b[i] = true;                        // the last ones
  else if (level === 1) { b[ROW - 1] = true; b[Math.random() < 0.5 ? ROW - 2 : rint(3, ROW - 3)] = true; }   // the last, and the one before or one in the middle
  else for (const i of shuffle(range(ROW - 2).map((k) => k + 2)).slice(0, n)) b[i] = true;   // anywhere after the first two
  return b;
}

// a row for a page that already has the rows in `before`: never the same pattern twice in a row, and not too many of one kind
function makeRow(level, set, before) {
  for (let t = 0; t < TRIES; t++) {
    const [kind, , options] = weighted(KINDS[level]), pat = options[rint(0, options.length - 1)];
    if (before.at(-1)?.key === kind + pat || before.filter((r) => r.kind === kind).length >= KIND_MAX[kind]) continue;
    const n = rint(...BLANKS[level]);
    const row = { kind, set: 'tc'.includes(kind) ? 'shapes' : set, base: 0, key: kind + pat };
    if (kind === 't' || kind === 'c') {
      const step = pat;
      if (kind === 't') { row.base = rint(0, TURNERS.length - 1); const r0 = rint(0, 3); row.vals = range(ROW).map((k) => (((r0 + k * step) % 4) + 4) % 4); }
      else row.vals = range(ROW).map((k) => (step > 0 ? k + 1 : ROW - k));
      row.blank = placeBlanks(level, n);
      return row;
    }
    const letters = [...new Set(pat)], two = shuffle([0, 1]);
    const pick = kind === 's' ? shuffle(range(6)).slice(0, letters.length) : two;
    row.vals = range(ROW).map((k) => pick[letters.indexOf(pat[k % pat.length])]);
    if (kind !== 's') row.base = rint(0, 5);
    row.blank = placeBlanks(level, n);
    if (unitOk(row.vals, row.blank, pat.length)) return row;
  }
  // fall back to the simplest row there is
  return { kind: 's', set, base: 0, key: 'sAB', vals: range(ROW).map((k) => k % 2), blank: range(ROW).map((k) => k === ROW - 1) };
}

/* ======== answer link and QR code ======== */
// #ss0abcabcab.ft3… : a row per dot-separated part: kind, picture set, base picture, then each square,
// a digit where it's shown and a letter (a = 0, b = 1 …) where it's empty
const LETTERS = 'abcdefghij';
const answerHash = (page) => '#' + page.rows.map((r) => r.kind + SET_CODE[r.set] + r.base + r.vals.map((v, i) => (r.blank[i] ? LETTERS[v] : v)).join('')).join('.');
const answerBase = () => (location.hostname.endsWith('github.io') ? location.origin + location.pathname : PUBLIC_URL);

function parseHash() {
  const parts = location.hash.slice(1).split('.');
  const rows = parts.map((p) => {
    const m = /^([sfztc])([st])(\d)([0-9a-j]{8})$/.exec(p);
    if (!m) return null;
    const cells = [...m[4]], kind = m[1], base = +m[3];
    const row = { kind, set: SET_NAMES.find((k) => SET_CODE[k] === m[2]), base,
      vals: cells.map((ch) => (/\d/.test(ch) ? +ch : LETTERS.indexOf(ch))), blank: cells.map((ch) => !/\d/.test(ch)) };
    const max = { s: 5, f: 1, z: 1, t: 3, c: 8 }[kind];
    if (row.vals.some((v) => v > max) || (kind === 'c' && row.vals.some((v) => v < 1)) || base > (kind === 't' ? TURNERS.length - 1 : 5)) return null;
    return row;
  });
  return rows.length && rows.every(Boolean) ? { rows } : null;
}

// the QR code as SVG, s mm square at x, y; on screen it's also a link to the answer
function qrSvg(hash, x, y, s) {
  if (typeof qrcode !== 'function') return '';   // library didn't load
  const q = qrcode(0, 'M');
  q.addData(answerBase() + hash);
  q.make();
  const n = q.getModuleCount(), pad = 1, t = n + 2 * pad;
  let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + pad} ${r + pad}h1v1h-1z`;
  return `<a href="${hash}" target="_blank"><g transform="translate(${f(x)} ${f(y)}) scale(${f(s / t)})">
    <rect width="${t}" height="${t}" fill="#fff"/><path d="${d}" fill="#000" shape-rendering="crispEdges"/></g></a>`;
}

/* ======== drawing a page ======== */
const SHEET_W = 186, SHEET_H = 272.5;   // mm inside the page margins
const ROW_GAP = 0.45, ROW_GAP_MAX = 1.1;             // gap between rows, as a share of a square: at least, and at most when the page has room
const HEAD_GAP = 6, PIECES_GAP = 9;                   // mm
const GO = 0.5;                                       // the "start here" triangle's room, as a share of a square

// returns an <svg> sized in mm. opts: qr (answer QR code above), pieces (cut-out squares below), answer (gaps filled, yellow)
function pageSvg(page, opts) {
  const { rows } = page, R = rows.length, pieces = opts.pieces ? page.pieces : [];
  const pr = Math.ceil(pieces.length / ROW), head = opts.qr ? QR + HEAD_GAP : 0, cut = pr ? PIECES_GAP : 0;
  const c = Math.min(MAX_CELL, SHEET_W / (ROW + GO), (SHEET_H - head - cut) / (R + (R - 1) * ROW_GAP + pr));
  const spare = opts.qr ? SHEET_H - head - cut - (R + pr) * c : 0;   // on a printed page, spread the rows out to fill it
  const gap = R > 1 ? Math.min(ROW_GAP_MAX * c, Math.max(ROW_GAP * c, spare / (R - 1))) : 0;
  const rw = (ROW + GO) * c, W = opts.qr ? SHEET_W : rw, ox = (W - rw) / 2;
  const H = head + R * c + (R - 1) * gap + (pr ? cut + pr * c : 0), th = Math.max(0.3, c * 0.02);
  let s = `<svg class="pt" width="${f(W)}mm" height="${f(H)}mm" viewBox="${f(-th)} ${f(-th)} ${f(W + 2 * th)} ${f(H + 2 * th)}" aria-hidden="true">`;
  if (opts.qr) s += qrSvg(answerHash(page), W - QR, 0, QR);

  rows.forEach((row, r) => {
    const y = head + r * (c + gap), x0 = ox + GO * c;
    s += `<path class="go" d="M${f(ox + c * 0.08)} ${f(y + c * 0.3)}L${f(ox + c * 0.38)} ${f(y + c / 2)}L${f(ox + c * 0.08)} ${f(y + c * 0.7)}z"/>`;
    row.vals.forEach((v, k) => {
      const cls = row.blank[k] ? (opts.answer ? 'cell hint' : 'cell gap') : 'cell';
      s += `<rect class="${cls}" stroke-width="${f(th)}" x="${f(x0 + k * c)}" y="${f(y)}" width="${f(c)}" height="${f(c)}" rx="${f(c * 0.08)}"/>`;
      if (!row.blank[k] || opts.answer) s += item(row, v, x0 + (k + 0.5) * c, y + c / 2, c * PIC);
    });
  });

  // cut-out pieces: one per empty square, the same size as a square, past a dashed line with scissors
  if (pr) {
    const py = head + R * c + (R - 1) * gap + cut, mid = py - cut / 2, sc = cut * 0.8;
    s += `<line class="sep" stroke-width="${f(th)}" x1="${f(ox + sc * 1.1)}" y1="${f(mid)}" x2="${f(ox + rw)}" y2="${f(mid)}"/>${scissors(ox + sc / 2, mid, sc)}`;
    const cols = Math.min(pieces.length, ROW), px = ox + GO * c + (ROW - cols) * c / 2;
    pieces.forEach(([r, k], j) => {
      const x = px + (j % cols) * c, y = py + Math.floor(j / cols) * c;
      s += `<rect class="cut" stroke-width="${f(th)}" x="${f(x)}" y="${f(y)}" width="${f(c)}" height="${f(c)}"/>`;
      s += item(rows[r], rows[r].vals[k], x + c / 2, y + c / 2, c * PIC);
    });
  }
  return s + '</svg>';
}

/* ======== maker: sheets ======== */
let pages = [];   // each page is { rows, pieces: [row, square] for every gap, shuffled }

const pickSet = () => (settings.pics === 'mix' ? SET_NAMES[rint(0, SET_NAMES.length - 1)] : settings.pics);
function makePage() {
  const rows = [];
  for (let r = 0; r < settings.rows; r++) rows.push(makeRow(settings.level, pickSet(), rows));
  return { rows, pieces: shuffle(rows.flatMap((row, r) => range(ROW).filter((k) => row.blank[k]).map((k) => [r, k]))) };
}

const REROLL = '<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9" fill="none" stroke="#1f2a44" stroke-width="2.6" stroke-linecap="round"/><path d="M20 3v6h-6" fill="none" stroke="#1f2a44" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function renderPages() {
  const pieces = settings.pieces === 'yes';
  $('pages').innerHTML = pages.map((pg, i) => `<div class="page"><div class="sheet">${pageSvg(pg, { qr: true, pieces })}</div>
    <button class="reroll" data-i="${i}" aria-label="New patterns for this page" title="New patterns for this page">${REROLL}</button></div>`).join('');
  fitPages();
}

// shrink the A4 previews to the screen width (print resets the zoom)
function fitPages() {
  const sheetPx = 210 * 96 / 25.4;
  document.documentElement.style.setProperty('--z', Math.min(1, $('pages').clientWidth / sheetPx).toFixed(3));
}

function readControls() {
  settings = {
    level: clamp($('level').value, 0, LEVELS.length - 1, DEFAULTS.level),
    pics: [...SET_NAMES, 'mix'].includes($('pics').value) ? $('pics').value : DEFAULTS.pics,
    rows: ROWS.includes(+$('rows').value) ? +$('rows').value : DEFAULTS.rows,
    pieces: $('pieces').value === 'no' ? 'no' : 'yes',
    sheets: clamp($('sheets').value, 1, SHEETS_MAX, DEFAULTS.sheets),
  };
  writeControls();
  saveSettings();
}
function writeControls() {
  if (!ROWS.includes(settings.rows)) settings.rows = DEFAULTS.rows;
  if (![...SET_NAMES, 'mix'].includes(settings.pics)) settings.pics = DEFAULTS.pics;
  for (const k of ['level', 'pics', 'rows', 'pieces', 'sheets']) $(k).value = settings[k];
  $('sheets').min = 1; $('sheets').max = SHEETS_MAX;
}

function newAll() { pages = range(settings.sheets).map(makePage); renderPages(); }

function startMaker() {
  $('level').innerHTML = LEVELS.map((name, i) => `<option value="${i}">${name}</option>`).join('');
  $('rows').innerHTML = ROWS.map((n) => `<option value="${n}">${n}</option>`).join('');
  writeControls();
  for (const k of ['level', 'pics', 'rows']) $(k).addEventListener('change', () => { readControls(); newAll(); });
  $('pieces').addEventListener('change', () => { readControls(); renderPages(); });
  $('sheets').addEventListener('change', () => {   // keep the pages already made, add or drop at the end
    readControls();
    pages = pages.slice(0, settings.sheets);
    while (pages.length < settings.sheets) pages.push(makePage());
    renderPages();
  });
  $('new').addEventListener('click', () => { readControls(); newAll(); });
  $('print').addEventListener('click', () => { readControls(); window.print(); });
  $('pages').addEventListener('click', (e) => {
    const b = e.target.closest('.reroll');
    if (!b) return;
    pages[+b.dataset.i] = makePage();
    renderPages();
  });
  addEventListener('resize', fitPages);
  newAll();
}

/* ======== answer page ======== */
function showAnswer(page) {
  document.body.classList.add('answering');
  $('solved').innerHTML = `${pageSvg(page, { answer: true })}<a id="make" href="./">Make new patterns</a>`;
}

/* ======== start ======== */
function route() {
  const page = location.hash.length > 1 && parseHash();
  if (page) showAnswer(page);
  else { document.body.classList.remove('answering'); if (!pages.length) startMaker(); }
}
addEventListener('hashchange', () => location.reload());
route();
</script>
<script>
// Offline support: sw.js caches this page. Once the page has loaded, send it every file the page used (fonts,
// the QR library) so those work offline too. Fails quietly where unsupported, e.g. on file://.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then((reg) => {
    const send = () => reg.active && reg.active.postMessage({ cache: [location.href, ...performance.getEntriesByType('resource').map((r) => r.name)] });
    send(); setTimeout(send, 5000); setTimeout(send, 20000);
  }).catch(() => {});
  // When sw.js says a newer version of this page has just been downloaded, reload once to show it: straight away if
  // nobody has tapped or pressed a key yet, otherwise when the page comes back after 5+ minutes away, so a game in
  // progress is never lost. A timestamp in sessionStorage stops a second reload within 30 s.
  let started = false, newer = false, hiddenAt = 0;
  addEventListener('pointerdown', () => { started = true; }, true);
  addEventListener('keydown', () => { started = true; }, true);
  const reload = () => {
    const key = 'tbx-sw-reload:' + location.pathname;
    try { if (Date.now() - (+sessionStorage.getItem(key) || 0) < 30000) return; sessionStorage.setItem(key, Date.now()); } catch { return; }
    location.reload();
  };
  navigator.serviceWorker.addEventListener('message', (e) => { if (e.data && e.data.updated) { newer = true; if (!started) reload(); } });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) hiddenAt = Date.now();
    else if (newer && hiddenAt && Date.now() - hiddenAt >= 5 * 60 * 1000) reload();
  });
}
</script>
